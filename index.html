<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Actueel bibliotheeknieuws uit Nederland — automatisch bijgewerkt.">
  <title>Bibliotheeknieuws</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar sticky-top" id="main-navbar">
  <div class="container-xl">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <span class="navbar-logo-icon"><i class="bi bi-book-half"></i></span>
      <span class="navbar-title">Bibliotheeknieuws</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="update-badge d-none d-md-flex align-items-center gap-1" id="update-badge" style="display:none!important">
        <i class="bi bi-clock-history"></i>
        <span id="update-time"></span>
      </span>
      <button class="btn-refresh" id="refresh-btn" title="Nu bijwerken">
        <i class="bi bi-arrow-clockwise" id="refresh-icon"></i>
        <span class="d-none d-sm-inline">Vernieuwen</span>
      </button>
    </div>
  </div>
</nav>

<!-- HERO / SEARCH -->
<div class="search-hero">
  <div class="container-xl">
    <div class="search-hero-inner">
      <div class="search-wrapper">
        <label class="search-label" for="search-input">Zoek in bibliotheeknieuws</label>
        <div class="search-input-group">
          <i class="bi bi-search search-icon"></i>
          <input type="search" id="search-input" class="search-field"
                 placeholder="Zoek in bibliotheeknieuws…" autocomplete="off">
          <button class="btn-search" id="search-btn">
            <i class="bi bi-search me-1"></i>Zoeken
          </button>
        </div>
      </div>
      <div class="results-count-wrap">
        <span id="results-count" class="results-count"></span>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="container-xl py-4">

  <!-- Category filter -->
  <div class="filter-section mb-3">
    <div class="category-scroll-wrap">
      <div class="d-flex gap-2 align-items-center" id="category-bar">
        <button class="category-pill active" data-category="Alle">
          <i class="bi bi-grid-3x3-gap-fill"></i>
          <span>Alle</span>
          <span class="count" id="count-alle">0</span>
        </button>
        <!-- Category pills inserted by JS -->
      </div>
    </div>
  </div>

  <!-- Source filter -->
  <div class="source-scroll-wrap mb-4">
    <div class="d-flex gap-2" id="source-bar">
      <!-- Source buttons inserted by JS -->
    </div>
  </div>

  <!-- Loading state: skeleton cards -->
  <div id="loading-state">
    <div class="row g-3">
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--medium"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-line--xs"></div>
              <div class="skeleton-line skeleton-line--xs"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--medium"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-line--xs"></div>
              <div class="skeleton-line skeleton-line--xs"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 d-none d-lg-block">
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--medium"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-line--xs"></div>
              <div class="skeleton-line skeleton-line--xs"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 d-none d-sm-block">
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--medium"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-line--xs"></div>
              <div class="skeleton-line skeleton-line--xs"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 d-none d-lg-block">
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-line--xs"></div>
              <div class="skeleton-line skeleton-line--xs"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 d-none d-lg-block">
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-line skeleton-line--medium"></div>
            <div class="skeleton-line skeleton-line--full"></div>
            <div class="skeleton-footer">
              <div class="skeleton-line skeleton-line--xs"></div>
              <div class="skeleton-line skeleton-line--xs"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="loading-label">Nieuws ophalen…</p>
  </div>

  <!-- Error state -->
  <div id="error-state" class="d-none">
    <div class="error-card">
      <div class="error-icon"><i class="bi bi-wifi-off"></i></div>
      <div class="error-content">
        <h2 class="error-title">Kon bronnen niet laden</h2>
        <p class="error-detail" id="error-detail"></p>
        <button class="btn-retry" id="retry-btn">
          <i class="bi bi-arrow-clockwise me-2"></i>Opnieuw proberen
        </button>
      </div>
    </div>
  </div>

  <!-- Article grid -->
  <div class="row g-3 d-none" id="articles-grid"></div>

  <!-- Empty state -->
  <div class="empty-state d-none" id="empty-state">
    <div class="empty-state-icon"><i class="bi bi-binoculars"></i></div>
    <h2 class="empty-state-title">Geen artikelen gevonden</h2>
    <p class="empty-state-text">Probeer andere zoektermen of verwijder een filter.</p>
    <button class="btn-clear-filter" id="clear-filter-btn">
      <i class="bi bi-x-circle me-2"></i>Filters wissen
    </button>
  </div>

</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container-xl">
    <div class="footer-inner">
      <div class="footer-brand">
        <i class="bi bi-book-half me-2"></i>
        <span>Bibliotheeknieuws</span>
      </div>
      <div class="footer-sources" id="footer-sources"></div>
      <div class="footer-meta">
        Automatisch bijgewerkt elke 60 minuten &nbsp;&middot;&nbsp; &copy; <span id="footer-year"></span>
      </div>
    </div>
  </div>
</footer>

<!-- Toast container -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>
<script src="static/app.js"></script>
</body>
</html>
