<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Actueel bibliotheeknieuws uit Nederland — automatisch bijgewerkt.">
  <title>{% block title %}Bibliotheeknieuws{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="main-navbar">
  <div class="container-xl">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <i class="bi bi-book-half fs-4"></i>
      <span class="fw-bold">Bibliotheeknieuws</span>
    </a>
    <span class="navbar-text text-white-50 small ms-2 d-none d-lg-block">
      Actueel nieuws voor de Nederlandse bibliotheeksector
    </span>

    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="badge bg-white text-primary small d-none d-md-flex align-items-center gap-1" id="update-badge">
        <i class="bi bi-clock"></i>
        <span id="update-time">laden…</span>
      </span>
      <button class="btn btn-sm btn-outline-light" id="refresh-btn" title="Nu bijwerken" onclick="triggerRefresh()">
        <i class="bi bi-arrow-clockwise" id="refresh-icon"></i>
      </button>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="container-xl py-4">
  {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="mt-5 py-4 border-top bg-light">
  <div class="container-xl">
    <div class="row g-3 align-items-center">
      <div class="col-md-8">
        <div class="d-flex flex-wrap gap-3 align-items-center">
          <span class="text-muted small fw-semibold">Bronnen:</span>
          {% for src in sources %}
          <a href="/?source={{ src.id }}"
             class="source-badge text-decoration-none small"
             style="--src-color: {{ src.color }}">
            <i class="bi {{ src.icon }}"></i> {{ src.name }}
          </a>
          {% endfor %}
        </div>
      </div>
      <div class="col-md-4 text-md-end text-muted small">
        Automatisch bijgewerkt elke 60 minuten<br>
        <a href="/api/status" class="text-muted text-decoration-none">API status</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
